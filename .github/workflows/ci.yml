name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff pytest
      # Error-level lint only (syntax, undefined names) - no style nitpicks
      - run: ruff check --select E9,F63,F7,F82 .
      # Parse-check the GTK file too (compile only, gi not needed)
      - run: python -m py_compile artifact_deck.py sandbox.py vendor.py
      - run: python -m pytest tests/ -v
